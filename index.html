<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="НОЛЬ — калькуляторы, конвертеры и полезные инструменты.">
  <meta name="theme-color" content="#edf2f7">

  <title>НОЛЬ</title>

  <link rel="icon" href="icons/favicon.ico" sizes="any">
  <link rel="icon" href="icons/favicon-32x32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="icons/favicon-16x16.png" sizes="16x16" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="icons/site.webmanifest">

  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/themes/standard.css">
  <link rel="stylesheet" href="css/themes/vista.css">
  <link rel="stylesheet" href="css/themes/summer.css">
  <link rel="stylesheet" href="css/base.css">

  <link rel="stylesheet" href="css/components/button.css">
  <link rel="stylesheet" href="css/components/field.css">
  <link rel="stylesheet" href="css/components/number.css">
  <link rel="stylesheet" href="css/components/select.css">
  <link rel="stylesheet" href="css/components/checkbox.css">
  <link rel="stylesheet" href="css/components/segmented.css">
  <link rel="stylesheet" href="css/components/note.css">
  <link rel="stylesheet" href="css/components/display.css">
  <link rel="stylesheet" href="css/components/card.css">
  <link rel="stylesheet" href="css/components/status.css">
  <link rel="stylesheet" href="css/components/result.css">
  <link rel="stylesheet" href="css/components/game.css">

  <link rel="stylesheet" href="css/shell.css">
  <link rel="stylesheet" href="css/overlays.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/mobile.css">

  <script type="module" src="js/app.js"></script>
</head>

<body
  data-theme="standard"
  data-color-scheme="light"
  data-layout="desktop"
  data-screen="normal"
  data-app-state="loading"
>
  <div class="app">
    <header class="header" id="header">
      <button class="brand" id="brandButton" type="button">
        <span class="brand-mark">
          <span class="brand-bracket">[</span><span data-i18n="app.name">НОЛЬ</span><span class="brand-bracket">]</span>
        </span>
        <span class="brand-beta">beta</span>
      </button>

      <div class="header-right">
        <div class="radio" id="radioMount"></div>

        <a
          class="ui-button ui-button--icon community-link"
          id="communityLink"
          href="https://vk.ru/inside_zero"
          target="_blank"
          rel="noopener noreferrer"
          title="Сообщество НОЛЬ во ВКонтакте"
          aria-label="Сообщество НОЛЬ во ВКонтакте — открыть в новой вкладке"
        >
          <svg
            class="community-link__icon"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            aria-hidden="true"
            focusable="false"
          >
            <path
              fill="currentColor"
              d="M12.785 16.241c-5.465 0-8.582-3.747-8.712-9.982h2.737c.09 4.577 2.108 6.516 3.707 6.916V6.259h2.578v3.948c1.579-.17 3.237-1.969 3.797-3.948h2.578c-.43 2.438-2.228 4.237-3.507 4.977 1.279.6 3.327 2.169 4.107 5.005h-2.838c-.61-1.898-2.128-3.367-4.137-3.567v3.567h-.31Z"
            />
          </svg>
        </a>
      </div>
    </header>

    <main class="workspace">
      <section class="slot selected" id="slotA" data-slot="A" tabindex="-1">
        <div class="block-picker">
          <select class="ui-select" id="categoryA" aria-label="Категория слота A"></select>
          <select class="ui-select" id="calculatorA" aria-label="Калькулятор слота A"></select>
        </div>

        <div class="block-calc">
          <div class="calc-mount" id="mountA"></div>
        </div>

        <div class="ui-result calc-result" id="resultPanelA">
          <div class="ui-result__main result-main">
            <div class="ui-result__label result-label" data-i18n="slot.result">Результат</div>
            <div class="ui-result__value result-value" id="resultA">—</div>
          </div>

          <div class="ui-result__actions result-actions">
            <button
              class="ui-result__button result-btn"
              id="copyA"
              type="button"
              data-i18n-title="tooltip.copy"
              data-i18n-aria-label="tooltip.copy"
              title="Копировать результат"
              aria-label="Копировать результат"
            >⧉</button>

            <button
              class="ui-result__button result-btn"
              id="transferA"
              type="button"
              data-i18n-title="tooltip.transferToB"
              data-i18n-aria-label="tooltip.transferToB"
              title="Перенести в B"
              aria-label="Перенести в B"
            >→</button>
          </div>
        </div>
      </section>

      <aside class="system-panel">
        <button
          class="ui-button ui-button--icon system-btn"
          id="undoBtn"
          type="button"
          data-i18n-title="tooltip.undo"
          data-i18n-aria-label="tooltip.undo"
          title="Отменить действие"
          aria-label="Отменить действие"
        >↶</button>

        <div class="system-divider" aria-hidden="true"></div>

        <button
          class="ui-button ui-button--icon system-btn"
          id="langBtn"
          type="button"
          title="Сменить язык"
          aria-label="Сменить язык"
        >🇷🇺</button>

        <div class="system-divider" aria-hidden="true"></div>

        <button
          class="ui-button ui-button--icon system-btn"
          id="themeBtn"
          type="button"
          title="Сменить цветовую схему"
          aria-label="Сменить цветовую схему"
        >🌙</button>

        <div class="system-divider" aria-hidden="true"></div>

        <button
          class="ui-button ui-button--icon system-btn"
          id="fullscreenBtn"
          type="button"
          title="Полный экран"
          aria-label="Полный экран"
          aria-pressed="false"
        >⛶</button>
      </aside>

      <section class="slot" id="slotB" data-slot="B" tabindex="-1">
        <div class="block-picker">
          <select class="ui-select" id="categoryB" aria-label="Категория слота B"></select>
          <select class="ui-select" id="calculatorB" aria-label="Калькулятор слота B"></select>
        </div>

        <div class="block-calc">
          <div class="calc-mount" id="mountB"></div>
        </div>

        <div class="ui-result calc-result" id="resultPanelB">
          <div class="ui-result__actions result-actions">
            <button
              class="ui-result__button result-btn"
              id="transferB"
              type="button"
              data-i18n-title="tooltip.transferToA"
              data-i18n-aria-label="tooltip.transferToA"
              title="Перенести в A"
              aria-label="Перенести в A"
            >←</button>

            <button
              class="ui-result__button result-btn"
              id="copyB"
              type="button"
              data-i18n-title="tooltip.copy"
              data-i18n-aria-label="tooltip.copy"
              title="Копировать результат"
              aria-label="Копировать результат"
            >⧉</button>
          </div>

          <div class="ui-result__main result-main">
            <div class="ui-result__label result-label" data-i18n="slot.result">Результат</div>
            <div class="ui-result__value result-value" id="resultB">—</div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div
    class="toast"
    id="toast"
    role="status"
    aria-live="polite"
    aria-atomic="true"
  ></div>

  <!-- Справка временно отключена. Разметка сохранена для доработки. -->
  <dialog class="help-dialog" id="helpDialog" aria-labelledby="helpTitle">
    <div class="help-header">
      <h2 id="helpTitle" data-i18n="help.title">Справка</h2>

      <button
        class="ui-button ui-button--icon help-close"
        id="helpClose"
        type="button"
        data-i18n-title="help.close"
        data-i18n-aria-label="help.close"
        title="Закрыть справку"
        aria-label="Закрыть справку"
      >✕</button>
    </div>

    <div class="help-body">
      <nav class="help-tabs" id="helpTabs"></nav>
      <div class="help-content" id="helpContent"></div>
    </div>
  </dialog>
</body>
</html>
